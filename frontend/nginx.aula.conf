# Nginx del modo aula: sirve el frontend compilado y reenvía la API
# al backend. Todo queda dentro de la red local del centro.
server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    root /usr/share/nginx/html;
    index index.html;

    # API del backend (compatible con los flujos SSE: sin re-bufferizar
    # más de lo que el backend pida vía X-Accel-Buffering)
    location /api/ {
        proxy_pass http://backend:8001;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
    }

    # Archivos subidos (logos de equipos, imágenes de fichas…)
    location /static/ {
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
    }

    # El service worker de la PWA nunca se cachea: así las actualizaciones
    # de la app llegan a las tablets del aula
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Recursos con hash en el nombre: cache larga
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA: cualquier ruta interna vuelve a index.html
    location / {
        try_files $uri /index.html;
    }
}
